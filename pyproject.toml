[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mafia-rl"
version = "0.1.0"
description = "A configurable Mafia game engine for reinforcement-learning research"
requires-python = ">=3.9"

[project.optional-dependencies]
rl = [
    "gymnasium>=0.29",
    "numpy>=1.24",
    "sb3-contrib>=2.3",
]

[project.scripts]
mafia-rl = "mafia_rl.runner:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
